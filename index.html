<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>给周晶晶的专属浪漫 ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 升级为更梦幻的渐变色 */
            background: linear-gradient(125deg, #fff1eb 0%, #ace0f9 100%);
            min-height: 100vh;
            overflow: hidden;
            font-family: 'STHeitiTC-Light', 'Microsoft YaHei', sans-serif;
            position: relative;
        }

        /* 景深效果，让背景更有层次感 */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255,255,255,0.3) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 1;
        }

        /* 核心告白卡片：升级为磨砂玻璃质感 */
        .center-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.5); /* 更透明 */
            backdrop-filter: blur(15px); /* 更强模糊 */
            -webkit-backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 30px; /* 更圆润 */
            text-align: center;
            box-shadow: 0 15px 40px rgba(166, 193, 238, 0.4);
            z-index: 10;
            width: 85%;
            max-width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        .center-card h1 {
            color: #ff6b81;
            font-size: 26px;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(255,107,129,0.2);
        }

        .center-card p {
            color: #666;
            font-size: 16px;
            line-height: 1.8;
            font-weight: 300;
        }

        .heart-icon {
            display: inline-block;
            color: #ff4d6d;
            font-size: 30px;
            margin-bottom: 5px;
            animation: heartBeat 1.5s infinite;
        }

        /* 底部增加一个小小的专属签名 */
        .signature {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            z-index: 5;
            letter-spacing: 1px;
        }

        /* 漂浮弹幕升级：增加发光效果和更柔和的动画 */
        .floating-text {
            position: absolute;
            white-space: nowrap;
            font-weight: 400;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            animation: floatingUp 8s ease-in-out forwards; /* 更慢更柔和 */
            letter-spacing: 1px;
        }

        /* 唯美樱花雨效果 */
        .petal {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.7;
            z-index: 1;
            animation: petalRain linear infinite;
        }

        /* 动画定义 */
        @keyframes floatingUp {
            0% { transform: translateY(105vh) translateX(0) scale(0.9); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-15vh) translateX(10px) scale(1.05); opacity: 0; }
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
            60% { transform: scale(1); }
        }

        @keyframes petalRain {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="petalContainer"></div>

    <div class="center-card">
        <div class="heart-icon">❤</div>
        <h1>For 周晶晶</h1>
        <p>
            从遇见你的那一刻起，<br>
            我就知道自己无处可逃。<br>
            世间的例外很少，<br>
            而你，占据了所有的偏爱。
        </p>
    </div>

    <div class="signature">Forever Your Exception</div>

    <script>
        // 升级版：更高级、更深情的文本内容
        const words = [
            "晶晶，你是我的无可替代 ❤️",
            "满心欢喜，只因有你",
            "遇见你，是我最大的幸运 ✨",
            "你是我的例外与偏心",
            "目光所至，全都是你",
            "周晶晶，我会一直都在 💌",
            "所有浪漫，都属于你",
            "我的心，只为你跳动",
            "周晶晶，我们要一起走很久",
            "想把最好的都给你",
            "始于心动，终于白首",
            "周晶晶，今天也超级喜欢你",
            "你是最闪耀的那颗星 ✨",
            "我的未来里，一定要有你",
            "对你的喜欢，藏都藏不住"
        ];

        // 柔和的莫兰迪色系加高亮色
        const colors = [
            "#ff6b81", "#845ef7", "#5c7cfa", "#22b8cf", 
            "#20c997", "#fab005", "#fd7e14", "#ffffff"
        ];

        // 1. 生成漂浮文字
        function createFloatingText() {
            const el = document.createElement("div");
            el.className = "floating-text";
            
            // 随机内容和发光效果
            const text = words[Math.floor(Math.random() * words.length)];
            const color = colors[Math.floor(Math.random() * colors.length)];
            el.innerText = text;
            el.style.color = color;
            el.style.textShadow = `0 0 10px ${color}80, 0 0 20px ${color}40`; // 文字发光
            
            // 随机位置和大小
            const x = Math.random() * (window.innerWidth - 220);
            el.style.left = `${Math.max(15, x)}px`;
            el.style.fontSize = `${Math.floor(Math.random() * 4 + 15)}px`; // 稍微调大一点点
            
            // 随机动画时长
            const duration = Math.random() * 4 + 7; // 7-11秒，更慢
            el.style.animationDuration = `${duration}s`;

            document.body.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, duration * 1000);
        }

        // 2. 生成唯美花瓣雨
        function createPetal() {
            const container = document.getElementById('petalContainer');
            const petal = document.createElement('div');
            petal.className = 'petal';
            
            // 随机大小、位置、花瓣形状（轻微变化）
            const size = Math.random() * 7 + 6 + 'px';
            petal.style.width = size;
            petal.style.height = size;
            petal.style.left = Math.random() * window.innerWidth + 'px';
            
            // 随机粉色调
            const pinkShades = ['#fff1eb', '#ffd1dc', '#ffb6c1', '#ffa07a'];
            petal.style.background = pinkShades[Math.floor(Math.random() * pinkShades.length)];
            
            // 随机动画时长
            const duration = Math.random() * 5 + 8; // 8-13秒
            petal.style.animationDuration = `${duration}s`;

            container.appendChild(petal);

            setTimeout(() => {
                petal.remove();
            }, duration * 1000);
        }

        // 定时生成，控制密度
        setInterval(createFloatingText, 600); // 弹幕密度
        setInterval(createPetal, 300); // 花瓣密度

        // 初始填充
        for (let i = 0; i < 4; i++) setTimeout(createFloatingText, i * 200);
        for (let i = 0; i < 10; i++) setTimeout(createPetal, i * 100);

    </script>
</body>
</html>
